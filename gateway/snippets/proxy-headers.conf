# Included by every proxied location. nginx drops ALL inherited
# proxy_set_header lines as soon as a location sets one of its own (the
# websocket one does), so these can't live at server level.
proxy_set_header Host              $host;
# The real client address. Set here, never passed through from the client:
# be and the SFU trust this header (blacklist, admin reclaim).
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
