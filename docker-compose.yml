# The whole stack behind one nginx gateway, plus an optional TURN relay.
#
#   make docker-setup   write or update .env and the TLS cert (see `make help`)
#   make docker-up      build the images and start everything
#   make docker-down    stop and remove it
#   make tls            Let's Encrypt cert for DOMAIN (EC2 deployments)
#
# Only the gateway's HTTP/HTTPS ports, the SFU's UDP media range and, when
# TURN is on, the TURN ports are published to the host. be, fe and the SFU's
# REST/websocket port are reachable only on the internal network.
#
# Variables come from .env (written by `make docker-setup`):
#   APP_HOST_IP         public (or LAN) address clients reach this machine on;
#                       the SFU advertises it as its media (ICE) address
#   APP_PUBLIC_HOST     hostname for links and the certificate (DuckDNS name),
#                       or the same as APP_HOST_IP
#   APP_ROOM_PASSCODE   passcode required to create a room
#   APP_JWT_SECRET      signs admin tokens
#   APP_HTTPS_PORT      host port for the gateway's HTTPS (default 8443)
#   APP_HTTP_PORT       host port for its HTTP redirect (default 8088)
#   APP_UDP_PORTS       SFU media port range (default 50000-50199)
#   APP_MAX_PARTICIPANTS  most peers per room; 0 = no limit
#   APP_TURN_USER / APP_TURN_PASSWORD   TURN long-term credentials
#   APP_TURN_URLS       TURN URLs handed to browsers (empty when TURN is off)
#   APP_TURN_RELAY_MIN / _MAX   TURN relay UDP range (default 49152-49200)
#   COMPOSE_PROFILES    "turn" starts the TURN relay
#   APP_SUBNET          internal network (default 172.28.0.0/24)
name: capstone

services:
  gateway:
    build: ./gateway
    environment:
      GATEWAY_HTTPS_PORT: ${APP_HTTPS_PORT:-8443}
    ports:
      - "${APP_HTTPS_PORT:-443}:443"
      - "${APP_HTTP_PORT:-80}:80"
    volumes:
      - ./gateway/certs:/etc/nginx/certs:ro
      # Blocked IPs, written by be (see BLOCKLIST_FILE below).
      - blocklist:/etc/nginx/blocklist
    depends_on:
      - fe
      - be
      - sfu
    networks: [internal]
    restart: unless-stopped

  fe:
    build:
      context: ./capstone_fe
      args:
        # Empty = same origin; the gateway routes /api to be.
        PUBLIC_API_BASE_URL: ""
    networks: [internal]
    restart: unless-stopped

  be:
    build: ./capstone_be
    environment:
      ROOM_PASSCODE: ${APP_ROOM_PASSCODE:?run make docker-setup}
      JWT_SECRET: ${APP_JWT_SECRET:?run make docker-setup}
      SFU_BASE_URL: http://sfu:9000
      # What browsers use, so it goes through the gateway over TLS.
      SFU_WS_URL: wss://${APP_PUBLIC_HOST:?run make docker-setup}:${APP_HTTPS_PORT:-8443}/ws
      ICE_SERVERS: stun:stun.l.google.com:19302
      TURN_URLS: ${APP_TURN_URLS:-}
      TURN_USERNAME: ${APP_TURN_USER:-}
      TURN_CREDENTIAL: ${APP_TURN_PASSWORD:-}
      # Without the port (443) and with it (8443 locally); both are accepted.
      ALLOWED_ORIGINS: https://${APP_PUBLIC_HOST:?run make docker-setup},https://${APP_PUBLIC_HOST}:${APP_HTTPS_PORT:-8443}
      # Only the gateway sets X-Real-IP, so only this network may.
      TRUSTED_PROXIES: ${APP_SUBNET:-172.28.0.0/24}
      # Gateway enforces these blocks; the gateway mounts this volume.
      BLOCKLIST_FILE: /var/lib/capstone/blocklist/blocklist.conf
    volumes:
      - blocklist:/var/lib/capstone/blocklist
    depends_on:
      - sfu
    networks: [internal]
    restart: unless-stopped

  sfu:
    build: ./capstone_sfu
    environment:
      BIND_ADDR: 0.0.0.0:9000
      SFU_UDP_PORTS: ${APP_UDP_PORTS:-50000-50199}
      # Most peers (sharers + watchers) per room; 0 or unset = no limit.
      MAX_PARTICIPANTS: ${APP_MAX_PARTICIPANTS:-0}
      # The container's own address is unreachable from browsers; advertise
      # the host's instead. Media reaches it through the published UDP range.
      SFU_PUBLIC_IPS: ${APP_HOST_IP:?run make docker-setup}
      ICE_SERVERS_JSON: '[{"urls":["stun:stun.l.google.com:19302"]}]'
      TURN_URLS: ${APP_TURN_URLS:-}
      TURN_USERNAME: ${APP_TURN_USER:-}
      TURN_CREDENTIAL: ${APP_TURN_PASSWORD:-}
    ports:
      - "${APP_UDP_PORTS:-50000-50199}:${APP_UDP_PORTS:-50000-50199}/udp"
    networks: [internal]
    restart: unless-stopped

  # Relays media for clients whose networks block direct UDP (some carriers,
  # venue Wi-Fi). Only runs with TURN=1 (COMPOSE_PROFILES=turn in .env).
  turn:
    image: coturn/coturn:4.6.2
    profiles: [turn]
    # Host networking: the relay needs the real public interface and its
    # own UDP range, which would otherwise have to be published one by one.
    network_mode: host
    # No leading "-n": the image's entrypoint evaluates each argument with
    # echo, which would swallow "-n". Without a config file turnserver just
    # warns and uses these flags.
    command:
      - --log-file=stdout
      - --no-cli
      - --fingerprint
      - --no-multicast-peers
      - --lt-cred-mech
      - --user=${APP_TURN_USER:?run make docker-setup}:${APP_TURN_PASSWORD:?run make docker-setup}
      - --realm=${APP_PUBLIC_HOST:?run make docker-setup}
      # The address handed to clients for relayed media.
      - --external-ip=${APP_HOST_IP:?run make docker-setup}
      - --listening-port=3478
      - --tls-listening-port=5349
      # The gateway's certificate (Let's Encrypt via `make tls`, or mkcert locally).
      - --cert=/certs/capstone.crt
      - --pkey=/certs/capstone.key
      - --min-port=${APP_TURN_RELAY_MIN:-49152}
      - --max-port=${APP_TURN_RELAY_MAX:-49200}
    volumes:
      - ./gateway/certs:/certs:ro
    restart: unless-stopped

volumes:
  blocklist:

networks:
  internal:
    ipam:
      config:
        - subnet: ${APP_SUBNET:-172.28.0.0/24}
