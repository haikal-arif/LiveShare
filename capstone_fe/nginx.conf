# Serves the built SPA. Only static files live here; /api and /ws are
# routed to the backend and SFU by the gateway in front of this container.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build output never changes under the same name.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Routes such as /room/ABC-234 only exist in the browser, so any path
    # without a file gets the app shell. It must never be cached, or a
    # redeploy would keep serving stale bundle names.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
